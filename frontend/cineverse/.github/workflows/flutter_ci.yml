name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Formatação
        run: dart format --set-exit-if-changed lib test

      - name: Lint
        run: flutter analyze

      - name: Testes
        run: flutter test
